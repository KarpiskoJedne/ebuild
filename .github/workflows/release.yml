name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build CLI
        run: CGO_ENABLED=0 go build -o ebuild-${{ matrix.target }} ./cmd/ebuild
      - name: Build daemon (unix)
        if: runner.os != 'Windows'
        run: cargo build --release --manifest-path internal/daemon/Cargo.toml && cp target/release/ebuild-daemon ebuild-daemon-${{ matrix.target }}
      - name: SBOM
        run: ./ebuild-${{ matrix.target }} build //... && echo sbom-ok
      - uses: softprops/action-gh-release@v2
        with:
          files: ebuild-*
