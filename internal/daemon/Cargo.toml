[package]
name = "ebuild-daemon"
version = "0.1.0"
edition = "2021"
description = "ebuild native system daemon: kernel file watching, shm event ring, BLAKE3 CAS, WASM sandbox"
license = "Apache-2.0"

[[bin]]
name = "ebuild-daemon"
path = "worker_host.rs"

[dependencies]
libc = "0.2"
blake3 = "1"
rayon = "1"
flate2 = "1"
wasmtime = "30"
wasmtime-wasi = "30"

[dev-dependencies]
wat = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
